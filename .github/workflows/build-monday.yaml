name: "Build onlyoffice-monday"

run-name: "Build onlyoffice-monday: ${{ github.event.inputs.tag || github.run_number }}"

on:
  push:
    branches:
    - develop

  workflow_dispatch:
    inputs:
      tag:
        description: 'Specify tag (ex. rc5) or it will be set automaticaly :rc<run_number>'
        type: string
        required: false
    
jobs:
  build:
    name: "Build monday"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ gateway, tenant, user ]
    steps:
      - name: Checkout code 
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: handle-rc-tag
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          MANUAL_TAG: ${{ github.event.inputs.tag }}
        run: |
          echo "APP_VERSION=$()" >> "$GITHUB_ENV" # Should be set!
          if [[ "$EVENT" == 'push' && "$REF" == 'develop' ]]; then
           echo "RC_TAG=rc${{ github.run_number }}" >> "$GITHUB_ENV"
          elif [[ "$EVENT" == 'workflow_dispatch' && -z "$TAG" ]]; then
           echo "RC_TAG=rc${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SERVICE_NAME: ${{ matrix.service }}
        run: |
          ./mvnw install
          ./mvnw package -pl onlyoffice-monday-${SERVICE_NAME} -am
          ./mvnw -pl onlyoffice-monday-${SERVICE_NAME} jib:dockerBuild -Ddocker.image.name=onlyoffice/monday-${SERVICE_NAME}:${{ env.APP_VERSION }}-${{ github.event.inputs.tag || env.RC_TAG }}
          docker push onlyoffice/monday-${SERVICE_NAME}:${{ env.APP_VERSION }}-${{ github.event.inputs.tag || env.RC_TAG }}
